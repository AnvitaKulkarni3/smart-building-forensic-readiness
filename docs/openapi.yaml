openapi: 3.0.3
info:
  title: Smart Building Digital Forensic Readiness API
  version: 1.0.0
  description: Simulated smart-building forensic readiness API. No live devices are connected.
servers:
  - url: http://localhost:5000/api
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      properties:
        success: {type: boolean, example: false}
        message: {type: string}
paths:
  /health:
    get:
      security: []
      summary: API health and simulation mode
      responses:
        '200': {description: Operational}
  /auth/login:
    post:
      security: []
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
      responses:
        '200': {description: JWT and user}
        '401': {description: Invalid credentials}
  /auth/me:
    get:
      summary: Current user
      responses:
        '200': {description: User profile}
  /evidence:
    get:
      summary: Paginated evidence list
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100}}
        - {in: query, name: source, schema: {type: integer, minimum: 0, maximum: 11}}
        - {in: query, name: kind, schema: {type: string, enum: [event, alert]}}
      responses:
        '200': {description: Evidence page}
  /integrity/verify:
    post:
      summary: Verify evidence hash chain and seals
      responses:
        '200': {description: Verification findings}
  /integrity/seal:
    post:
      summary: Create HMAC-SHA256 checkpoint
      responses:
        '201': {description: Seal metadata; signature not exposed}
  /integrity/export:
    get:
      summary: Export evidence bundle (admin only)
      responses:
        '200': {description: Manifest, evidence, seals and custody}
  /incidents/inject:
    post:
      summary: Inject simulated incident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenarioId]
              properties:
                scenarioId: {type: string, enum: [S1, S2, S3, S4, S5, S6]}
      responses:
        '201': {description: Simulated incident}
  /investigation/reconstruct:
    post:
      summary: Reconstruct an incident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [incidentId, delayDays]
              properties:
                incidentId: {type: string}
                delayDays: {type: number, minimum: 0}
      responses:
        '200': {description: Reconstruction timeline and score}
