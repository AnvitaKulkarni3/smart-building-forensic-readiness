services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/smart-building
      CORS_ORIGIN: http://localhost:8080
    ports: ["5000:5000"]
    depends_on:
      mongo: {condition: service_healthy}
    command: sh -c "node src/seed.js && node src/server.js"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_SOCKET_URL: http://localhost:5000
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  mongo_data:
